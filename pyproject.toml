[project]
name = "pechenka"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "albumentations>=2.0.8",
    "keyboard>=0.13.5",
    "opencv-python>=5.0.0.93",
    "pyautogui>=0.9.54",
    "pydirectinput>=1.0.4",
    "pynput>=1.8.2",
    "ultralytics>=8.4.189",
]

[project.scripts]
pechenka = "pechenka:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
